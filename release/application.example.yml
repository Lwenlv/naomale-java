server:
  port: ${SERVER_PORT:3000}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript,image/svg+xml

spring:
  application:
    name: naomale-java
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/naomale_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 600000
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  web:
    resources:
      cache:
        period: 0

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'

logging:
  level:
    root: INFO
    com.naomale: INFO
